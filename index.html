<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #3d4a38;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 214, 228, 0.55) 0%, transparent 42%),
        radial-gradient(ellipse at 88% 12%, rgba(196, 226, 184, 0.5) 0%, transparent 40%),
        radial-gradient(ellipse at 78% 88%, rgba(255, 232, 196, 0.45) 0%, transparent 45%),
        linear-gradient(165deg, #eef6e8 0%, #f7efe6 48%, #f3e8ef 100%);
    }

    .defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .meadow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .flower {
      position: absolute;
      transform-origin: 50% 100%;
      animation: sway 7s ease-in-out infinite;
    }

    .flower svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 6px 10px rgba(70, 80, 50, 0.18));
    }

    .f1 { top: 2%; left: 2%; width: 150px; animation-delay: 0s; }
    .f2 { top: 3%; right: 2%; width: 132px; animation-delay: -1.4s; animation-duration: 8s; }
    .f3 { bottom: 1%; left: 3%; width: 140px; animation-delay: -2.2s; }
    .f4 { bottom: 1%; right: 2%; width: 158px; animation-delay: -3.1s; animation-duration: 9s; }
    .f5 { top: 38%; left: 0.5%; width: 96px; animation-delay: -4s; }
    .f6 { top: 42%; right: 0.5%; width: 90px; animation-delay: -2.8s; }

    .petal {
      position: absolute;
      width: 18px;
      height: 28px;
      overflow: visible;
      animation: fall linear infinite;
      filter: drop-shadow(0 2px 3px rgba(80, 60, 50, 0.18));
    }

    .p1 { left: 12%; animation-duration: 14s; animation-delay: 0s; }
    .p2 { left: 28%; width: 14px; height: 22px; animation-duration: 17s; animation-delay: -3s; }
    .p3 { left: 46%; animation-duration: 15s; animation-delay: -6s; }
    .p4 { left: 63%; width: 16px; height: 24px; animation-duration: 16s; animation-delay: -2s; }
    .p5 { left: 78%; animation-duration: 18s; animation-delay: -8s; }
    .p6 { left: 90%; width: 15px; height: 23px; animation-duration: 13s; animation-delay: -5s; }

    main {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      background: rgba(255, 252, 247, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(210, 188, 168, 0.45);
      border-radius: 24px;
      padding: 48px 40px 40px;
      box-shadow:
        0 18px 40px rgba(90, 80, 50, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      animation: bloom 1.1s ease-out both;
    }

    .corner {
      position: absolute;
      width: 72px;
      height: 72px;
    }

    .corner svg { width: 100%; height: 100%; overflow: visible; }

    .c-tl { top: 6px; left: 8px; animation: sway 6s ease-in-out infinite; transform-origin: 20% 80%; }
    .c-tr { top: 6px; right: 8px; animation: sway 7s ease-in-out infinite reverse; transform-origin: 80% 80%; }
    .c-bl { bottom: 6px; left: 8px; animation: sway 8s ease-in-out infinite; transform-origin: 20% 20%; }
    .c-br { bottom: 6px; right: 8px; animation: sway 6.5s ease-in-out infinite reverse; transform-origin: 80% 20%; }

    h1 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
      color: #4a5c3e;
      text-align: center;
      animation: rise 0.9s 0.2s ease-out both;
    }

    .subtitle {
      display: block;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8fa37a;
      margin-bottom: 28px;
      animation: rise 0.9s 0.35s ease-out both;
    }

    ol {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px 12px 12px;
      margin-bottom: 12px;
      line-height: 1.55;
      font-size: 1.08rem;
      color: #44503c;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 16px;
      border: 1px solid rgba(196, 214, 176, 0.4);
      animation: rise 0.8s ease-out both;
      transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    }

    li:nth-child(1) { animation-delay: 0.45s; }
    li:nth-child(2) { animation-delay: 0.6s; }
    li:nth-child(3) { animation-delay: 0.75s; }

    li:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 18px rgba(120, 140, 90, 0.12);
    }

    .icon {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      animation: nod 5s ease-in-out infinite;
    }

    li:nth-child(2) .icon { animation-delay: -1.6s; }
    li:nth-child(3) .icon { animation-delay: -3.2s; }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes nod {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes fall {
      0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      100% { transform: translateY(110vh) rotate(280deg); opacity: 0.2; }
    }

    @keyframes bloom {
      from { opacity: 0; transform: scale(0.94) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .f1, .f2, .f3, .f4 { width: 88px; }
      .f5, .f6 { display: none; }
      main { padding: 40px 22px 28px; }
      h1 { font-size: 1.45rem; }
    }
  </style>
