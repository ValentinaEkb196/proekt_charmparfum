<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f6efe8;
      color: #3a2d28;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      max-width: 560px;
      width: 100%;
      background: #fffaf6;
      border: 1px solid #e4d5c8;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 12px 32px rgba(90, 60, 40, 0.08);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 28px;
      color: #5c3d32;
    }

    ol {
      padding-left: 1.4em;
      line-height: 1.7;
      font-size: 1.1rem;
    }

    li + li {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ol>
      <li>5 идей для постов для обзора новых ароматов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>контент план на неделю</li>
    </ol>
  </main>
</body>
</html>
