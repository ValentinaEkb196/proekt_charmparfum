<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #2c3228;
      background:
        radial-gradient(ellipse at 20% 0%, #f4ebe3 0%, transparent 50%),
        radial-gradient(ellipse at 90% 100%, #e8efe4 0%, transparent 46%),
        #f7f4ef;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 40px 36px 32px;
      background: #fffcf9;
      border: 1px solid #ece4d8;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(70, 62, 50, 0.08);
      animation: fade-up 0.7s ease both;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.3;
      color: #1f261c;
      animation: fade-up 0.7s 0.08s ease both;
    }

    .subtitle {
      display: block;
      margin: 8px 0 28px;
      font-size: 0.9rem;
      color: #7a8472;
      animation: fade-up 0.7s 0.16s ease both;
    }

    ol {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      line-height: 1.45;
      color: #3a4136;
      background: #f7f4ef;
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      animation: fade-up 0.65s ease both;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    li:nth-child(1) { animation-delay: 0.24s; }
    li:nth-child(2) { animation-delay: 0.34s; }
    li:nth-child(3) { animation-delay: 0.44s; }

    li:hover {
      transform: translateY(-3px);
      background: #fff;
      border-color: #dce6d4;
      box-shadow: 0 10px 22px rgba(80, 90, 70, 0.1);
    }

    li:hover .dot {
      transform: scale(1.12);
      background: #8fbf78;
    }

    .dot {
      flex: 0 0 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c3d4b6;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 20px 22px;
      }

      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <span class="subtitle">Выберите задачу, чтобы начать</span>
    <ol>
      <li>
        <span class="dot"></span>
        5 идей для постов для обзора новых ароматов
      </li>
      <li>
        <span class="dot"></span>
        3 идеи сторис на сегодня
      </li>
      <li>
        <span class="dot"></span>
        контент план на неделю
      </li>
    </ol>
  </main>
</body>
</html>
